services:
  - type: web
    name: securepay-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
    disk:
      name: securepay-db
      mountPath: /app/data
      sizeGB: 1

  - type: web
    name: securepay-frontend
    env: static
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: securepay-backend
          type: web
          property: host
