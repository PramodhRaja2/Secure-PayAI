services:
  - type: web
    name: securepay-api
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    # Note: Free tier Render instances spin down after inactivity.
    # To use a persistent disk for SQLite, an upgraded tier is required.
    # We will let Render manage the DB temporarily in the free filesystem.
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
