databases:
  - name: securepay-db
    databaseName: securepay
    user: securepay_user
    plan: free
    region: ohio

services:
  - type: web
    name: securepay-api
    env: python
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: securepay-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.10.12
